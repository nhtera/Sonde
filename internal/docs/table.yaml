    doc: "forces HTTP/3"
  - name: "insecure"
    status: "supported"
    doc: "skips TLS certificate verification"
  - name: "ipv6"
    status: "supported"
    doc: "resolves hostnames to IPv6 addresses only"
  - name: "jobs"
    status: "supported"
    doc: "maximum number of parallel jobs"
  - name: "limit-rate"
    status: "supported"
    doc: "caps the transfer rate in bytes per second"
  - name: "location"
    status: "supported"
    doc: "follows HTTP redirects"
  - name: "location-trusted"
    status: "supported"
    doc: "follows redirects and forwards credentials to every host"
  - name: "max-filesize"
    status: "supported"
    doc: "caps the size of a downloaded file"
  - name: "max-redirs"
    status: "supported"
    doc: "maximum number of redirects to follow, -1 for unlimited"
  - name: "max-time"
    status: "supported"
    doc: "maximum time allowed for the whole transfer (seconds when no unit is given)"
  - name: "no-assert"
    status: "supported"
    doc: "ignores asserts defined in the file"
  - name: "no-color"
    status: "supported"
    doc: "disables colorized output"
  - name: "no-cookie-store"
    status: "supported"
    doc: "disables the cookie store between requests"
  - name: "no-header"
    status: "supported"
    doc: "removes a header from every request (repeatable)"
  - name: "no-jsonpath-coercion"
    status: "supported"
    doc: "keeps JSONPath results uncoerced"
  - name: "no-output"
    status: "supported"
    doc: "suppresses the default last-response-body output"
  - name: "no-pretty"
    status: "supported"
    doc: "disables pretty-printing of response output"
  - name: "no-progress-bar"
    status: "supported"
    doc: "never shows the test progress bar"
  - name: "no-proxy"
    status: "supported"
    doc: "lists hosts that bypass the proxy"
  - name: "pretty"
    status: "supported"
    doc: "pretty-prints JSON response output"
  - name: "proxy"
    status: "supported"
    doc: "routes the request through the given proxy"
  - name: "proxy-header"
    status: "supported"
    doc: "adds a header sent to the proxy only (repeatable)"
  - name: "retry"
    status: "supported"
    doc: "maximum retries on entry error, -1 for unlimited"
  - name: "retry-interval"
    status: "supported"
    doc: "delay between retries (milliseconds when no unit is given)"
  - name: "secret"
    status: "supported"
    doc: "defines a secret (NAME=VALUE); the name cannot be given again by another source"
  - name: "test"
    status: "supported"
    doc: "activates test mode"
  - name: "user"
    status: "supported"
    doc: "adds Basic authentication with USER:PASSWORD"
  - name: "user-agent"
    status: "supported"
    doc: "sets the User-Agent header sent to the server"
  - name: "variable"
    status: "supported"
    doc: "defines a variable (NAME=VALUE); the environment and flags override it"
  - name: "verbose"
    status: "supported"
    doc: "same as --verbose"
  - name: "very-verbose"
    status: "supported"
    doc: "same as --very-verbose"
  - name: "verbosity"
    status: "supported"
    doc: "sets the verbosity level (brief, verbose or debug)"

# Sonde extensions: valid only in .sonde files, never checked against the
# Hurl inventory (docs/decisions/0004-streaming-protocols.md).
sonde:
  sections:
    - name: "SondeMessages"
      status: "supported"
      doc: "makes the entry a WebSocket exchange: ordered send, receive and close steps"
    - name: "SondeGrpc"
      status: "supported"
      doc: "makes the entry a gRPC call of the method its URL path names (`POST http://host/package.Service/Method`), with a JSON request body; empty, the descriptors come from server reflection"
  grpc_keys:
    - name: "proto"
      status: "supported"
      doc: "a `.proto` file compiled at run time (repeatable)"
    - name: "import-path"
      status: "supported"
      doc: "a directory where imports of proto files resolve (repeatable; default: each proto file's directory)"
    - name: "protoset"
      status: "supported"
      doc: "a binary FileDescriptorSet, as written by `protoc --descriptor_set_out --include_imports` or `buf build -o` (repeatable)"
  steps:
    - name: "send"
      status: "supported"
      doc: "sends one message: JSON, a backtick or multiline string or XML as a text frame; base64, hex or file as a binary frame"
    - name: "receive"
      status: "supported"
      doc: "waits for the next message, or the next N with `receive: N`"
    - name: "close"
      status: "supported"
      doc: "sends a close frame (1000, or `close: CODE`) and waits for the server's"
  options:
    - name: "sonde-stream-count"
      status: "supported"
      doc: "stops an event stream after N events"
    - name: "sonde-stream-max-bytes"
      status: "supported"
      doc: "stops a stream after N bytes (default 10485760); a WebSocket fails beyond it"
    - name: "sonde-stream-timeout"
      status: "supported"
      doc: "stops an event stream after this time (default 10s); a WebSocket `receive` still waiting then fails"
  queries:
    - name: "sondeStream"
      status: "supported"
      doc: "the data of each event or message received, as a list; `sondeStream \"event\"`, `\"id\"`, `\"retry\"` (SSE) or `\"type\"` (WebSocket) select another field"
    - name: "sondeGrpc"
      status: "supported"
      doc: "the status name of a gRPC call (`OK`, `NOT_FOUND`…); `sondeGrpc \"code\"` is the status code and `sondeGrpc \"message\"` the status message. A status other than OK fails the entry unless the entry uses this query"

differences:
  - area: "Config file"
    input: "A flag followed by a comment (`--insecure # note`) and another option on the next line"
    hurl: "error `Not expecting a value for this option` on the next line"
    sonde: "the comment ends the line; the next option is read"
  - area: "Config file"
    input: "A file that starts with a UTF-8 BOM, or has CRLF line ends"
    hurl: "error `Expecting an option starting with --` (BOM) or `Not expecting a value for this option` (CRLF after a flag)"
    sonde: "the BOM is ignored and CRLF is read as a line end"
  - area: "Config file"
    input: "`--no-progress-bar`"
    hurl: "turns the progress bar on"
    sonde: "turns it off (the progress bar is only shown with `--progress-bar`)"
  - area: "Syntax"
    input: "`fmt` and `export` of rare spellings: a status with leading zeros (`HTTP 000200`), an upper-case JSON exponent (`1.0E+2`), spaces inside a placeholder in a JSON body (`{{ x }}`), a count of `-0`"
    hurl: "normalized (`200`, `1.0e+2`, `{{x}}`, `0`)"
    sonde: "kept as written"
  - area: "Syntax"
    input: "`export json` of a value that is not valid JSON: `nth {{i}}`, a float too large for a double, a number JSON rejects (`0e`)"
    hurl: "written as is (invalid JSON)"
    sonde: "written as a string, so the document stays valid JSON"
  - area: "Syntax"
    input: "Curl import of a `-d`/`--data` body"
    hurl: "a ``` block, so the body gains a trailing newline"
    sonde: "a ```raw block: the body bytes are kept exactly"
  - area: "Syntax"
    input: "Curl import of `-H 'Name:'` (curl removes the header)"
    hurl: "`Name:` header with an empty value"
    sonde: "header removed, as curl does"
  - area: "Syntax"
    input: "`[Query]` and `[QueryStringParams]` (or `[Form]`/`[FormParams]`, `[Multipart]`/`[MultipartFormData]`) in one request"
    hurl: "only the first section is sent; `hurlfmt` drops the second"
    sonde: "both are sent; `sonde fmt` keeps both"
  - area: "Syntax"
    input: "Curl import of `-u user:pass`"
    hurl: "`user: \"user:pass\"` (the quotes are then part of the user name)"
    sonde: "`user: user:pass`"
  - area: "Syntax"
    input: "Regex literal errors other than an invalid `{…}` repetition"
    hurl: "Rust `regex` message"
    sonde: "Go `regexp` message (same position)"
  - area: "Syntax"
    input: "Regexes valid in only one engine, e.g. `a{,3}`, `\\d{2}{2}`, `a{1001}`, `[]-Z]`"
    hurl: "accepted"
    sonde: "rejected"
  - area: "Syntax"
    input: "… and the reverse, e.g. `[0-9[Query]`"
    hurl: "rejected"
    sonde: "accepted"
  - area: "Syntax"
    input: "XML body with DTD-declared entities"
    hurl: "accepted (libxml2)"
    sonde: "rejected: `invalid XML`"
  - area: "Syntax"
    input: "XML body with text or a comment before the root element"
    hurl: "rejected"
    sonde: "accepted"
  - area: "Syntax"
    input: "XML error position"
    hurl: "character where libxml2 failed"
    sonde: "last character read by Go's `encoding/xml` (same in all test files)"
  - area: "Syntax"
    input: "File larger than 64 MiB"
    hurl: "accepted"
    sonde: "rejected: `Issue reading from FILE: file is larger than 64 MiB`"
  - area: "Evaluation"
    input: "Integers beyond 64 bits in comparisons, e.g. `123456789012345678901234567890 > 9223372036854775807`"
    hurl: "compared as digit strings: false"
    sonde: "compared numerically: true"
  - area: "Evaluation"
    input: "Rendering of a float whose fraction is negative or below 2.2e-16, e.g. `toString` of `-1.5` or `1e-300`"
    hurl: "`-1.5.0`, `0.000…1.0`"
    sonde: "`-1.5`, `0.000…1`"
  - area: "Evaluation"
    input: "Negative JSONPath number literal with a fraction, e.g. `$[?@ == -1.5]`"
    hurl: "read as `-0.5`"
    sonde: "read as `-1.5`"
  - area: "Evaluation"
    input: "NaN (e.g. from XPath `number()` on text) compared with a number"
    hurl: "equal to every number"
    sonde: "equal to nothing, never less or greater"
  - area: "Evaluation"
    input: "Unprefixed XPath name on an XML document with a default namespace, e.g. `count(//title)`"
    hurl: "matches nothing (use `_:title`)"
    sonde: "also matches the namespaced elements"
  - area: "Evaluation"
    input: "Malformed XML response body for `xpath`, or XML using entities declared in a DTD"
    hurl: "libxml2 recovers what it can, expands the entities"
    sonde: "`Invalid XML` error"
  - area: "Evaluation"
    input: "HTML response for `xpath`"
    hurl: "libxml2 HTML parser"
    sonde: "HTML5 parser: `html`, `head` and `body` always exist"
  - area: "Evaluation"
    input: "`\\b` in regexes, and `\\W`/`\\S` inside a bracket class"
    hurl: "Unicode"
    sonde: "ASCII"
  - area: "Evaluation"
    input: "Response with several content codings, e.g. `Content-Encoding: gzip, br`"
    hurl: "decoded in listed order"
    sonde: "decoded in reverse order (last applied first)"
  - area: "Evaluation"
    input: "`Content-Encoding: zstd`"
    hurl: "`compression zstd is not supported`"
    sonde: "decoded"
  - area: "Evaluation"
    input: "Decoded (decompressed) body larger than 512 MiB"
    hurl: "decoded"
    sonde: "`Decompression error`"
  - area: "Evaluation"
    input: "JSON response nested deeper than 128 levels, or with a lone surrogate escape (`\\ud800`)"
    hurl: "`Invalid JSON`"
    sonde: "accepted (the surrogate reads as U+FFFD)"
  - area: "Evaluation"
    input: "`urlQueryParam` on a malformed or unusual URL, e.g. `http:///x`"
    hurl: "parsed by the Rust `url` crate (WHATWG rules)"
    sonde: "parsed by Go's `net/url`: `http:///x` is `empty host`, other messages differ"
  - area: "Evaluation"
    input: "Nested numbers compared by JSONPath `==`, e.g. `$[?@.a == [1]]` on `{\"a\": [1.0]}`"
    hurl: "compared as written: not equal"
    sonde: "compared by value: equal"
  - area: "Evaluation"
    input: "Date string with a leap second, e.g. `toDate` of `23:59:60`"
    hurl: "keeps the instant at 23:59:59.999999999"
    sonde: "rolls over to the next minute"
  - area: "Evaluation"
    input: "Regex syntax outside the common subset: `(?x)`, `\\u{…}`, repetitions over 1000, class set operations `&&` `--`; `\\Q…\\E`"
    hurl: "first group accepted, `\\Q…\\E` rejected"
    sonde: "first group rejected (`Invalid regex`), `\\Q…\\E` accepted"
  - area: "HTTP"
    input: "`http2` option on an `http://` URL"
    hurl: "tries an h2c upgrade"
    sonde: "HTTP/1.1"
  - area: "HTTP"
    input: "`http3` option or `--http3`"
    hurl: "HTTP/3 when libcurl supports it"
    sonde: "`Unsupported HTTP version` error"
  - area: "HTTP"
    input: "Order and case of response headers over HTTP/2, or through a proxy to an `https://` URL without `--http1.1`"
    hurl: "as received"
    sonde: "names lower-case (HTTP/2) or canonical, grouped by name and sorted (values of one name keep their order); HTTP/1.x responses otherwise keep wire order and case"
  - area: "HTTP"
    input: "`SONDE_HTTP1_WIRE=legacy`"
    hurl: "not applicable"
    sonde: "sends HTTP/1.x through Go's net/http as sonde did before its own wire layer: `--http1.0` is unsupported, response headers are sorted, and header names net/http refuses fail the request (kept for one minor release)"
  - area: "HTTP"
    input: "`--digest`, `--ntlm` or `--negotiate` answering a 401 challenge"
    hurl: "the verbose log shows both exchanges"
    sonde: "only the final exchange is logged and reported (the challenge is answered within the call, as libcurl does)"
  - area: "HTTP"
    input: "`--negotiate` credential cache"
    hurl: "any GSS-API cache (libcurl)"
    sonde: "a Kerberos file cache: `KRB5CCNAME` (`FILE:` caches) or `/tmp/krb5cc_<uid>`, configuration from `KRB5_CONFIG` or `/etc/krb5.conf`"
  - area: "HTTP"
    input: "The `Authorization` value a scheme computes (Digest response, NTLM and Negotiate tokens, AWS signature)"
    hurl: "printed in verbose output"
