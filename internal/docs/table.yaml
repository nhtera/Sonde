differences:
  - area: "Syntax"
    input: "Regex literal errors other than an invalid `{…}` repetition"
    hurl: "Rust `regex` message"
    sonde: "Go `regexp` message (same position)"
  - area: "Syntax"
    input: "Regexes valid in only one engine, e.g. `a{,3}`, `\\d{2}{2}`, `a{1001}`, `[]-Z]`"
    hurl: "accepted"
    sonde: "rejected"
  - area: "Syntax"
    input: "… and the reverse, e.g. `[0-9[Query]`"
    hurl: "rejected"
    sonde: "accepted"
  - area: "Syntax"
    input: "XML body with DTD-declared entities"
    hurl: "accepted (libxml2)"
    sonde: "rejected: `invalid XML`"
  - area: "Syntax"
    input: "XML body with text or a comment before the root element"
    hurl: "rejected"
    sonde: "accepted"
  - area: "Syntax"
    input: "XML error position"
    hurl: "character where libxml2 failed"
    sonde: "last character read by Go's `encoding/xml` (same in all test files)"
  - area: "Syntax"
    input: "JSON nested deeper than 1000 levels"
    hurl: "stack overflow"
    sonde: "rejected: `nesting is deeper than 1000 levels`"
  - area: "Syntax"
    input: "File larger than 64 MiB"
    hurl: "accepted"
    sonde: "rejected: `Issue reading from FILE: file is larger than 64 MiB`"
  - area: "Evaluation"
    input: "Integers beyond 64 bits in comparisons, e.g. `123456789012345678901234567890 > 9223372036854775807`"
    hurl: "compared as digit strings: false"
    sonde: "compared numerically: true"
  - area: "Evaluation"
    input: "Rendering of a float whose fraction is negative or below 2.2e-16, e.g. `toString` of `-1.5` or `1e-300`"
    hurl: "`-1.5.0`, `0.000…1.0`"
    sonde: "`-1.5`, `0.000…1`"
  - area: "Evaluation"
    input: "Negative JSONPath number literal with a fraction, e.g. `$[?@ == -1.5]`"
    hurl: "read as `-0.5`"
    sonde: "read as `-1.5`"
  - area: "Evaluation"
    input: "NaN (e.g. from XPath `number()` on text) compared with a number"
    hurl: "equal to every number"
    sonde: "equal to nothing, never less or greater"
  - area: "Evaluation"
    input: "Unprefixed XPath name on an XML document with a default namespace, e.g. `count(//title)`"
    hurl: "matches nothing (use `_:title`)"
    sonde: "also matches the namespaced elements"
  - area: "Evaluation"
    input: "Malformed XML response body for `xpath`, or XML using entities declared in a DTD"
    hurl: "libxml2 recovers what it can, expands the entities"
    sonde: "`Invalid XML` error"
  - area: "Evaluation"
    input: "HTML response for `xpath`"
    hurl: "libxml2 HTML parser"
    sonde: "HTML5 parser: `html`, `head` and `body` always exist"
  - area: "Evaluation"
    input: "`\\b` in regexes, and `\\W`/`\\S` inside a bracket class"
    hurl: "Unicode"
    sonde: "ASCII"
  - area: "Evaluation"
    input: "Response with several content codings, e.g. `Content-Encoding: gzip, br`"
    hurl: "decoded in listed order"
    sonde: "decoded in reverse order (last applied first)"
  - area: "Evaluation"
    input: "`Content-Encoding: zstd`"
    hurl: "`compression zstd is not supported`"
    sonde: "decoded"
  - area: "Evaluation"
    input: "Decoded (decompressed) body larger than 512 MiB"
    hurl: "decoded"
    sonde: "`Decompression error`"
  - area: "Evaluation"
    input: "JSON response nested deeper than 128 levels, or with a lone surrogate escape (`\\ud800`)"
    hurl: "`Invalid JSON`"
    sonde: "accepted (the surrogate reads as U+FFFD)"
  - area: "Evaluation"
    input: "`urlQueryParam` on a malformed or unusual URL, e.g. `http:///x`"
    hurl: "parsed by the Rust `url` crate (WHATWG rules)"
    sonde: "parsed by Go's `net/url`: `http:///x` is `empty host`, other messages differ"
  - area: "Evaluation"
    input: "Nested numbers compared by JSONPath `==`, e.g. `$[?@.a == [1]]` on `{\"a\": [1.0]}`"
    hurl: "compared as written: not equal"
    sonde: "compared by value: equal"
  - area: "Evaluation"
    input: "Date string with a leap second, e.g. `toDate` of `23:59:60`"
    hurl: "keeps the instant at 23:59:59.999999999"
    sonde: "rolls over to the next minute"
  - area: "Evaluation"
    input: "Regex syntax outside the common subset: `(?x)`, `\\u{…}`, repetitions over 1000, class set operations `&&` `--`; `\\Q…\\E`"
    hurl: "first group accepted, `\\Q…\\E` rejected"
    sonde: "first group rejected (`Invalid regex`), `\\Q…\\E` accepted"
  - area: "HTTP"
    input: "`http2` option on an `http://` URL"
    hurl: "tries an h2c upgrade"
    sonde: "HTTP/1.1"
  - area: "HTTP"
    input: "`http3` option or `--http3`"
    hurl: "HTTP/3 when libcurl supports it"
    sonde: "`Unsupported HTTP version` error"
  - area: "HTTP"
    input: "Order of response headers with different names"
    hurl: "as received"
    sonde: "grouped by name, names sorted (values of one name keep their order)"
  - area: "HTTP"
    input: "Default User-Agent"
    hurl: "`hurl/<version>`"
    sonde: "`sonde/<version>` (`SONDE_DEFAULT_USER_AGENT` replaces it)"
  - area: "HTTP"
    input: "`--version` output"
    hurl: "Hurl and libcurl versions and features"
    sonde: "sonde version, commit, build date, Go version"
  - area: "HTTP"
    input: "Request-file path escaping the file root through a symbolic link"
    hurl: "allowed (lexical check)"
    sonde: "denied"
  - area: "HTTP"
    input: "`cacert`, `cert`, `key`, `pinnedpubkey`, `netrc-file` in `[Options]`"
    hurl: "any path, relative to the working directory"
    sonde: "relative to the working directory, confined to the file root (command line values are not confined)"
  - area: "HTTP"
    input: "`unix-socket` in `[Options]`"
    hurl: "any path"
    sonde: "confined to the file root"
  - area: "HTTP"
    input: "A failing `repeat` iteration followed by a passing one (`--continue-on-error`)"
    hurl: "file reported as successful"
    sonde: "file fails; only retried attempts are discounted"
  - area: "HTTP"
    input: "Proxy environment variables"
    hurl: "`http_proxy`, `https_proxy`, `no_proxy`, `ALL_PROXY` (libcurl)"
    sonde: "`http_proxy`, `https_proxy`, `no_proxy` (and uppercase forms); `ALL_PROXY` ignored; netrc credentials are not sent through an environment proxy unless `--netrc-allow-reroute`"
  - area: "HTTP"
    input: "Response body size without `--max-filesize`"
    hurl: "unlimited"
    sonde: "512 MiB (raw and decoded)"
  - area: "HTTP"
    input: "Cookie domain matching"
    hurl: "suffix match (`evilexample.com` matches a cookie of `example.com`)"
    sonde: "dot-boundary match"
  - area: "HTTP"
    input: "`--very-verbose` and verbose connection lines (`* Connected to…`, `** …`)"
    hurl: "libcurl debug lines"
    sonde: "not printed"
  - area: "HTTP"
    input: "`--cookie-jar` file header"
    hurl: "`# This file was generated by Hurl`"
    sonde: "`# This file was generated by sonde`"
  - area: "HTTP"
    input: "Secrets in `--json` output"
    hurl: "printed as is"
    sonde: "redacted (`***`), as in every other output"
  - area: "HTTP"
    input: "Parallel runs (`--parallel`, `--jobs`)"
    hurl: "parallel"
    sonde: "sequential (Phase 5)"
  - area: "HTTP"
    input: "Reports (`--report-*`), `--curl`"
    hurl: "supported"
    sonde: "`option … is not supported by sonde yet` (Phases 5 and 8)"
