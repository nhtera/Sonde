config:
  - name: "color"
    status: "supported"
    doc: "forces colorized output"
  - name: "compressed"
    status: "supported"
    doc: "requests a compressed response and decodes it"
  - name: "connect-timeout"
    status: "supported"
    doc: "maximum time allowed to establish the connection (seconds when no unit is given)"
  - name: "continue-on-error"
    status: "supported"
    doc: "keeps running remaining files after a failure"
  - name: "delay"
    status: "supported"
    doc: "sleep before each request (milliseconds when no unit is given)"
  - name: "error-format"
    status: "supported"
    doc: "controls how error messages are rendered (short or long)"
  - name: "fail-with-body"
    status: "supported"
    doc: "writes the response body of a failed entry"
  - name: "header"
    status: "supported"
    doc: "adds a custom header to every request (repeatable)"
  - name: "http1.0"
    status: "supported"
    doc: "forces HTTP/1.0"
  - name: "http1.1"
    status: "supported"
    doc: "forces HTTP/1.1"
  - name: "http2"
    status: "supported"
    doc: "forces HTTP/2"
  - name: "http3"
    status: "unsupported"
