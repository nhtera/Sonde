openapi: 3.1.0
info:
  title: Sonde Spike Petstore
  description: Original fixture for the Sonde OpenAPI-validation library spike. Same API as petstore-3.0.yaml, expressed in 3.1 syntax. Not derived from any external spec.
  version: 1.1.0
servers:
  - url: https://api.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A page of pets
          headers:
            X-Rate-Limit:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/mine:
    get:
      operationId: listMyPets
      summary: List the caller's own pets (literal path, overlaps /pets/{petId})
      security:
        - basicAuth: []
      responses:
        '200':
          description: The caller's pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by id
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deletePet
      summary: Delete a pet by id
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted, no content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Pet:
      type: object
      $defs:
        NonEmptyString:
          type: string
          minLength: 1
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/Pet/$defs/NonEmptyString'
          examples:
            - Rex
            - Milo
        tag:
          type: [string, "null"]
        status:
          type: string
          enum:
            - available
            - pending
            - adopted
        kind:
          const: pet
      examples:
        - id: 1
          name: Rex
          kind: pet
          status: available
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
