# golangci-lint v2 configuration. Version pinned in Makefile and CI.
version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
  exclusions:
    rules:
      # The printer writes to an embedded strings.Builder, which cannot fail.
      - path: internal/syntax/printer\.go
        linters: [gosec]
        text: G104
      # These error strings reproduce the upstream CLI/config-file messages
      # verbatim (capitalization and punctuation included), so `sonde`'s
      # wording matches what conformance oracles expect.
      - path: internal/config/(assignment|configfile|duration|env|precedence|value)\.go
        linters: [revive, staticcheck]
        text: "error-strings|ST1005"
    presets:
      - comments
      - common-false-positives
      - std-error-handling
  settings:
    depguard:
      # Package boundaries from docs/architecture.md §2. Each package rule
      # denies every sonde package except its allowed dependencies (in lax
      # mode the longer allow match wins; `$` makes it exact). Test files are exempt.
      rules:
        no-cli-imports:
          list-mode: lax
          files: ["$all", "!$test", "!**/cmd/sonde/**"]
          deny:
            - pkg: github.com/nhtera/sonde/internal/cli
              desc: "nothing imports internal/cli (architecture §2)"
        net-http:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/httpx/**"
            - "!**/internal/stream/**"
            - "!**/internal/mock/**"
            - "!**/internal/openapi/**"
            - "!**/internal/grpcx/**"
          deny:
            - pkg: net/http
              desc: "net/http is allowed only in internal/httpx, internal/stream, internal/mock, internal/openapi, internal/grpcx (architecture §2)"
        pkg-cmd-sonde:
          list-mode: lax
          files: ["**/cmd/sonde/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "cmd/sonde may import only: internal/cli (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/cli$
        pkg-engine:
          list-mode: lax
          files: ["**/engine/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "engine may import only: internal/syntax, internal/value, internal/redact, internal/template, internal/query, internal/filter, internal/predicate, internal/runerr, exchange, internal/httpx, internal/stream, internal/grpcx, internal/sandbox, internal/enginex (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/enginex$
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/value$
            - github.com/nhtera/sonde/internal/redact$
            - github.com/nhtera/sonde/internal/template$
            - github.com/nhtera/sonde/internal/query$
            - github.com/nhtera/sonde/internal/filter$
            - github.com/nhtera/sonde/internal/predicate$
            - github.com/nhtera/sonde/internal/runerr$
            - github.com/nhtera/sonde/exchange$
            - github.com/nhtera/sonde/internal/httpx$
            - github.com/nhtera/sonde/internal/stream$
            - github.com/nhtera/sonde/internal/grpcx$
            - github.com/nhtera/sonde/internal/sandbox$
        pkg-exchange:
          list-mode: lax
          files: ["**/exchange/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "exchange may import only: internal/charset, internal/codec (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/charset$
            - github.com/nhtera/sonde/internal/codec$
        pkg-syntax:
          list-mode: lax
          files: ["**/internal/syntax/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/syntax may import only: internal/regex, internal/styled (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/regex$
            - github.com/nhtera/sonde/internal/styled$
        pkg-value:
          list-mode: lax
          files: ["**/internal/value/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/value may import only: internal/regex (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/regex$
        pkg-redact:
          list-mode: lax
          files: ["**/internal/redact/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/redact may import only: no sonde packages (leaf) (architecture §2)"
        pkg-sandbox:
          list-mode: lax
          files: ["**/internal/sandbox/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/sandbox may import only: no sonde packages (leaf) (architecture §2)"
        pkg-docs:
          list-mode: lax
          files: ["**/internal/docs/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/docs may import only: no sonde packages (leaf) (architecture §2)"
        pkg-template:
          list-mode: lax
          files: ["**/internal/template/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/template may import only: internal/syntax, internal/value, internal/runerr (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/value$
            - github.com/nhtera/sonde/internal/runerr$
        pkg-jsonpath:
          list-mode: lax
          files: ["**/internal/jsonpath/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/jsonpath may import only: internal/value (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/value$
        pkg-query:
          list-mode: lax
          files: ["**/internal/query/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/query may import only: internal/syntax, internal/value, exchange, internal/template, internal/filter, internal/runerr, internal/xpath, internal/datefmt (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/value$
            - github.com/nhtera/sonde/exchange$
            - github.com/nhtera/sonde/internal/template$
            - github.com/nhtera/sonde/internal/filter$
            - github.com/nhtera/sonde/internal/runerr$
            - github.com/nhtera/sonde/internal/xpath$
            - github.com/nhtera/sonde/internal/datefmt$
        pkg-filter:
          list-mode: lax
          files: ["**/internal/filter/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/filter may import only: internal/syntax, internal/value, internal/jsonpath, internal/template, internal/runerr, internal/xpath, internal/datefmt, internal/charset (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/value$
            - github.com/nhtera/sonde/internal/jsonpath$
            - github.com/nhtera/sonde/internal/template$
            - github.com/nhtera/sonde/internal/runerr$
            - github.com/nhtera/sonde/internal/xpath$
            - github.com/nhtera/sonde/internal/datefmt$
            - github.com/nhtera/sonde/internal/charset$
        pkg-predicate:
          list-mode: lax
          files: ["**/internal/predicate/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/predicate may import only: internal/syntax, internal/value, internal/template, internal/runerr, internal/datefmt (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/value$
            - github.com/nhtera/sonde/internal/template$
            - github.com/nhtera/sonde/internal/runerr$
            - github.com/nhtera/sonde/internal/datefmt$
        pkg-enginex:
          list-mode: lax
          files: ["**/internal/enginex/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/enginex may import only: internal/runerr, internal/syntax, internal/value (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/runerr$
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/value$
        pkg-runerr:
          list-mode: lax
          files: ["**/internal/runerr/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/runerr may import only: internal/syntax, internal/styled (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/styled$
        pkg-xpath:
          list-mode: lax
          files: ["**/internal/xpath/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/xpath may import only: internal/value (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/value$
        pkg-regex:
          list-mode: lax
          files: ["**/internal/regex/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/regex may import only: no sonde packages (leaf) (architecture §2)"
        pkg-styled:
          list-mode: lax
          files: ["**/internal/styled/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/styled may import only: no sonde packages (leaf) (architecture §2)"
        pkg-charset:
          list-mode: lax
          files: ["**/internal/charset/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/charset may import only: no sonde packages (leaf) (architecture §2)"
        pkg-codec:
          list-mode: lax
          files: ["**/internal/codec/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/codec may import only: no sonde packages (leaf) (architecture §2)"
        pkg-datefmt:
          list-mode: lax
          files: ["**/internal/datefmt/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/datefmt may import only: no sonde packages (leaf) (architecture §2)"
        pkg-httpx:
          list-mode: lax
          files: ["**/internal/httpx/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/httpx may import only: exchange, internal/sandbox, internal/codec (architecture §2)"
          allow:
            - github.com/nhtera/sonde/exchange$
            - github.com/nhtera/sonde/internal/sandbox$
            - github.com/nhtera/sonde/internal/codec$
        pkg-report:
          list-mode: lax
          files: ["**/internal/report/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/report may import only: engine, exchange (architecture §2)"
          allow:
            - github.com/nhtera/sonde/engine$
            - github.com/nhtera/sonde/exchange$
        pkg-config:
          list-mode: lax
          files: ["**/internal/config/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/config may import only: internal/value, internal/sandbox (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/value$
            - github.com/nhtera/sonde/internal/sandbox$
        pkg-dataset:
          list-mode: lax
          files: ["**/internal/dataset/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/dataset may import only: internal/value (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/value$
        pkg-openapi:
          list-mode: lax
          files: ["**/internal/openapi/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/openapi may import only: exchange, internal/syntax, engine (architecture §2)"
          allow:
            - github.com/nhtera/sonde/exchange$
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/engine$
        pkg-convert:
          list-mode: lax
          files: ["**/internal/convert/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/convert and its importer subpackages may import only: internal/convert, internal/syntax, exchange, internal/config (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/convert$
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/exchange$
            - github.com/nhtera/sonde/internal/config$
        pkg-lsp:
          list-mode: lax
          files: ["**/internal/lsp/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/lsp may import only: internal/syntax, internal/config, internal/docs (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/config$
            - github.com/nhtera/sonde/internal/docs$
        pkg-mock:
          list-mode: lax
          files: ["**/internal/mock/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/mock may import only: internal/openapi (architecture §2)"
          allow:
            - github.com/nhtera/sonde/internal/openapi$
        pkg-stream:
          list-mode: lax
          files: ["**/internal/stream/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/stream may import only: exchange, internal/httpx (architecture §2)"
          allow:
            - github.com/nhtera/sonde/exchange$
            - github.com/nhtera/sonde/internal/httpx$
        pkg-grpcx:
          list-mode: lax
          files: ["**/internal/grpcx/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/grpcx may import only: exchange (architecture §2)"
          allow:
            - github.com/nhtera/sonde/exchange$
        pkg-mcp:
          list-mode: lax
          files: ["**/internal/mcp/**", "!$test"]
          deny:
            - pkg: github.com/nhtera/sonde
              desc: "internal/mcp may import only: engine, internal/syntax, internal/config (architecture §2)"
          allow:
            - github.com/nhtera/sonde/engine$
            - github.com/nhtera/sonde/internal/syntax$
            - github.com/nhtera/sonde/internal/config$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nhtera/sonde
