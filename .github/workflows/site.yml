name: site

# The website (site/): landing page and docs at https://sonde.erai.dev.
#
#   changes      which paths a pull request touches (SITE_PATHS below)
#   site-build   no secrets: installs, checks, builds, verifies the output and
#                uploads it (main only)
#   site-gate    always runs; the required check
#   site-deploy  main only, environment "site": deploys the build job's
#                artifact with the pinned cf CLI; the token is on one step
#
# A finished desktop release run (release-desktop) starts a run on main, so
# the Download button points at the new release. (`on: release` would never
# fire: releases are created with GITHUB_TOKEN, which starts no workflows.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [release-desktop]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # cf needs Node 22.18 or later.
  NODE_VERSION: "22.18"
  # No CLI telemetry from CI.
  DO_NOT_TRACK: "1"
  # Everything the site build reads. site/scripts/ci-paths.mjs checks the
  # build's inputs (content/generated/inputs.json) against this list.
  SITE_PATHS: |
    site/**
    docs/**
    README.md
    SECURITY.md
    TRADEMARKS.md
    CONTRIBUTING.md
    desktop/MANUAL-TEST.md
    editors/vscode/syntaxes/**
    desktop/frontend/src/app/theme/**
    .github/workflows/site.yml

jobs:
  changes:
    # A desktop release run that failed published nothing new.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "site=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # No rename pairing: a moved file lists its old path too.
          git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
          node site/scripts/ci-paths.mjs match "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}

  site-build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    # No `environment:` and no secrets: this job runs the project's own
    # dependencies and code, including a pull request's.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: last-updated dates and the desktop release.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:install-scripts
      - run: npm run check:licenses
      - run: npm audit --audit-level=high
      # The deploy job's own install (cf only), checked here, without secrets.
      - run: npm --prefix deploy audit --audit-level=high
      - run: node scripts/check-install-scripts.mjs deploy/package-lock.json
      # The Download link: only desktop releases that are published (a tag
      # can exist before its release does). Only gh runs with the token here.
      - name: Published desktop releases
        run: gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/releases.txt"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run sync
        env:
          SONDE_SITE_RELEASES_FILE: ${{ runner.temp }}/releases.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx cf build
      - run: npm run finalize
      - run: npm run check-links
      - run: node scripts/ci-paths.mjs covers content/generated/inputs.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: The build changed no tracked or untracked file
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; exit 1; fi
      - run: npx cf deploy --prebuilt --mode production --dry-run
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-output
          path: site/.cloudflare/output/v0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  site-gate:
    if: always()
    needs: [changes, site-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes: $CHANGES, site-build: $BUILD"
          [ "$CHANGES" = success ] || exit 1
          case "$BUILD" in success|skipped) ;; *) exit 1 ;; esac
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.site-build.result }}

  site-deploy:
    needs: site-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://sonde.erai.dev
    permissions:
      contents: read
    # Never cancel a production deploy that has started.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      # Only the deploy manifest and the smoke script: no project code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site/deploy
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: site/deploy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-output
          path: out/.cloudflare/output/v0
      - name: Deploy
        working-directory: out
        run: ../site/deploy/node_modules/.bin/cf deploy --prebuilt --mode production --message "${GITHUB_SHA::12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: site/deploy/smoke.sh https://sonde.erai.dev
