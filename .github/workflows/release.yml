name: release

on:
  push:
    # Only CLI tags; the VS Code extension uses editors/vscode/v* tags.
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  # The tagged commit must pass the checks CI runs, whether or not CI ran
  # on it: environment protection can require a reviewer, not green CI.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # apicheck compares with the baseline tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # keep in sync with go.mod toolchain
          cache: false
      - run: go test ./...
      - run: make lint apicheck
      # Checks the whole module (go.mod included) against the previous CLI
      # tag and fails if the tag is not a valid next version. The module's
      # versions are listed from the module cache first, which holds only
      # the base: once the tag is pushed, anyone can fetch it through
      # proxy.golang.org before this job runs, and gorelease would then
      # refuse it as a version that already exists (v1.4.0). The tag push
      # itself is what keeps a version from being made twice.
      - name: gorelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null); then
            go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260908205506-85c1c2202aba
            go mod download "github.com/nhtera/sonde@$base"
            GOPROXY="file://$(go env GOMODCACHE)/cache/download,https://proxy.golang.org,direct" \
              "$(go env GOPATH)/bin/gorelease" -base="$base" -version="$TAG"
          else
            echo "gorelease: no earlier tag to compare with"
          fi

  release:
    needs: check
    runs-on: ubuntu-latest
    # Publish credentials (TAP_GITHUB_TOKEN, cosign OIDC) live only in this
    # protected environment.
    environment: release
    permissions:
      contents: write
      id-token: write # cosign keyless signing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # keep in sync with go.mod toolchain
          # This job holds id-token: write (cosign OIDC) and
          # TAP_GITHUB_TOKEN: never restore an Actions cache another job
          # (e.g. ci.yml, which runs on every push) could have poisoned.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          # The pushed tag, not whichever tag on HEAD sorts first: the same
          # commit may also carry an editors/vscode/v* tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  verify-install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # keep in sync with go.mod toolchain
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify install (${{ matrix.os }})
        shell: bash
        env:
          # Passed through the environment and quoted below, rather than
          # interpolated into `run:` — a tag name could otherwise contain
          # shell metacharacters (L3).
          VERSION: ${{ github.ref_name }}
        run: scripts/verify-install.sh "$VERSION"
