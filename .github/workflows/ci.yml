name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the toolchain directive in go.mod.
  GO_VERSION: "1.27.1"
  # Keep in sync with editors/vscode/package.json engines (Node, not vscode).
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Built from source with the repo toolchain; version pinned in Makefile.
      - run: make lint
      - run: go mod tidy -diff

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    env:
      # Test the matrix Go version, not the go.mod toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go build -o sonde-bin ./cmd/sonde
        env:
          CGO_ENABLED: "0"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the baseline tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Public API (engine, exchange) against the tag in .api-baseline.
      - run: make apicheck

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make race
      - run: make test-grpc-interop

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fuzz-smoke FUZZTIME=30s

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make vuln

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make licenses

  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make headers

  vscode:
    # Builds and tests the VS Code extension (editors/vscode) against a real
    # `sonde lsp` binary. The extension host has no display on a CI runner,
    # so the smoke test runs under Xvfb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build sonde and put it on PATH
        run: |
          mkdir -p "$HOME/bin"
          go build -o "$HOME/bin/sonde" ./cmd/sonde
          echo "$HOME/bin" >> "$GITHUB_PATH"
        env:
          CGO_ENABLED: "0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run lint
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - run: npm run bundle
        working-directory: editors/vscode
      - run: npm audit --audit-level=high
        working-directory: editors/vscode
      - run: xvfb-run -a npm test
        working-directory: editors/vscode
      - run: npx vsce package -o sonde.vsix
        working-directory: editors/vscode
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonde-vscode-extension
          path: editors/vscode/sonde.vsix
          if-no-files-found: error

  desktop:
    # The desktop app (desktop/, a nested module with its own go.mod). Its
    # Go code is vetted, tested and linted in the CGO-free builds: server
    # mode and the test-only e2e harness. Frontend dependencies install
    # with scripts disabled; the browser tests run against the harness.
    runs-on: ubuntu-latest
    env:
      # wails3 too: its cgo part (the WebKit version, for `wails3 doctor`)
      # needs GTK headers this job does not install.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make desktop-check
      - run: npm audit --audit-level=high
        working-directory: desktop/frontend
      - run: make desktop-vuln
      - run: npx playwright install --with-deps chromium webkit
        working-directory: desktop/frontend
      - run: make desktop-e2e
      # The budgets of the build output (the harness's are the browser
      # tests' own; the native ones need a display: scripts/perf.mjs).
      - name: Performance budgets (build output)
        # The shipped bundle (desktop-e2e built the harness's last).
        run: |
          npm --prefix frontend run build
          node scripts/perf.mjs --no-native >> "$GITHUB_STEP_SUMMARY"
        working-directory: desktop

  desktop-update:
    # The updater's tests (internal/update: the release feed, the signed
    # manifest, instance locks, the state machine) on macOS and Windows,
    # for every run, unlabelled: Linux runs them in the desktop job.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - run: go test -tags server ./internal/update/... ./cmd/update-manifest/...
        working-directory: desktop

  desktop-macos:
    # The native window build needs cgo and the platform webview, so it runs
    # on macOS, for pull requests labelled "desktop".
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'desktop')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make desktop-bindings
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: desktop/frontend
      - run: go vet ./... && go build -o /dev/null .
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
      - run: make lint-desktop-native

  desktop-windows:
    # The desktop module's Go tests on Windows (server build), for pull
    # requests labelled "desktop": a release is never their first run.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'desktop')
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - run: desktop/scripts/tools.sh install
      - run: |
          mkdir -p frontend/dist && echo '<!doctype html><title>Sonde</title>' > frontend/dist/index.html
          go vet -tags server ./... && go test -tags server ./...
        working-directory: desktop

  conformance:
    # Blocking on the manifest gate (internal/conformance/manifest.yaml): the
    # job fails if a blocking-lane script the manifest marks expect: pass
    # stops passing semantically. Everything else — the extended lane, the
    # network lane (skipped here), the timing lane — is report-only; see
    # docs/conformance.md and internal/conformance/gate.go.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: make conformance
        env:
          SONDE_CONFORMANCE_RESULTS: ${{ github.workspace }}/conformance-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-results
          path: conformance-results.json
          if-no-files-found: warn

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # HEAD may carry an editors/vscode/v* or desktop/v* tag (a version-bump
      # commit), which ignore_tags does not filter out for tags on HEAD.
      - name: Pin the last CLI tag
        run: echo "GORELEASER_CURRENT_TAG=$(git describe --tags --abbrev=0 --exclude 'editors/vscode/*' --exclude 'desktop/*')" >> "$GITHUB_ENV"
      - name: Tag namespaces stay out of the CLI's lookups
        run: scripts/check-tag-guards.sh
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          # sign/sbom need cosign/syft, installed only in the release job
          # (release.yml), which is the one that actually publishes.
          args: release --snapshot --clean --skip=sign,sbom
